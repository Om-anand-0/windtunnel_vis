name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Install Chromium (software WebGPU via SwiftShader)
        run: npx playwright install --with-deps chromium
      - name: Physics + voxelizer checks
        run: npm test
